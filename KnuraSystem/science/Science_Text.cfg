
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    @RESULTS
    {
        KnuraSrfLanded = This games startin' to show its age, huh?

        HopSrfLandedBS = You scoop up a surface sample.  It appears to mostly consist of dry dust and small stones.  
        HopSrfLandedRS = You collect a sample, trying your hardest not to damage the large, delicate ice crystals as you stuff them into your sample tube.   
        HopSrfLandedAR = You collect a scoop of snow from the moonlet's equatorial ridge; a blue-white, ice water flavoured gelato, with traces of a lower-density, purple-ish ice.  

        SkipSrfLandedBS = You scoop up a surface sample.  It appears to mostly consist of dry dust and small stones.  
        SkipSrfLandedSR = You collect a scoop of the moonlet's surface ice covering.  It is mainly made up of large, granular crystals, not totally unlike the salt you get on pretzels.  
        SkipSrfLandedHydroD = The snow here appears to be peppered with a dusting of oily, red-orange hydrocarbon dust.  You wonder if it came from Gloth?  

        GlothSrfSplashedssSea_wet = You fill a sample tube with the viscous green oil.  Under closer inspection, it appears to be full of tiny spores!  
        GlothSrfSplashedoSea_wet = You collect a sample of the viscous oil.  The liquid found here is more jiggly than on other parts of the moon.  
        GlothSrfSplashed = You collect a sample of surface liquid.  It's slick, oily and stains the glass tube.  You once saw something like this leaking out of your cars engine block shortly before it shot a piston through the bonnet.  
        GlothSrfSplashedrCrateL_wet = You collect a sample from the oily crater lake.  The liquid here wobbles and quivers with an almost living energy.  
        GlothSrfSplashedCAT_wet = Meow.  Owo.  Brrrauh.   
        GlothSrfLandedHIGH = You gather up a handful of off-white icy gravel and drop it into a sample capsule.  
        GlothSrfLandedMID = You take a sample of the icy-sandy stuff on the ground, and try to wipe the bit that stuck to your glove off on your EVA suit.  
        GlothSrfLandedLOW = The earth here is dense with mycelial root networks and their tiny fruiting bodies.  You collect some of the sandy soil in a sample tube, and place a tiny mushroom on top to seal the deal.  
        GlothSrfLandedSPECIAL = Hidden amongst the sandy, oily ice particles that you had expected to find here, you find trace amount of tiny, green shards of glassy stone.  Perhaps pieces of the asteroid that formed this impact site?  
        GlothSrfLanded = The ground here shows clear evidence of past exposure to a high temperature and pressure environment, consistent with an impact event.  You're think to yourself how vital it was that the KSA had you travel in a tin can for a couple decades to confirm that fact in person, rather than just looking at Gloth through a telescope.   
        GlothSrfLandedBIGSHROOM = The ground here is dense with fungal matts and mycelial networks.  You cut out a small swatch, roll it up, and slip it into a sample tube.  

        ChopleSrfLandedCRAGGLE = The ground here is far too hard to take a sample from.  You sweep a few pieces of glass-dust into the sample tube and call it good.  
        ChopleSrfLandedHIGH = You gather up some shards of material from the surface.  It's flakey and as green as sea glass.  
        ChopleSrfLandedvHigh = After giving the ground a good few hard kicks, you managed to break off some clumps of brittle material.  It's very light-weight, reflective, and full of tiny cracks and inclusions.  
        ChopleSrfLandedMID = You use one of your KSA-assigned pokey sticks to pry a flake of glass out of the ground.  You then use your KSA-assigned smashy-stick to break it into small enough pieces to fit in the sample tube.  
        ChopleSrfLandedLOW = After much poking and much smashing, you fail to break off a sample.  Aw man!  

        BasilSrfLandedMAR = The ground here is loose, soft, and almost soil-like.  You could imagine setting up a little farm here, and growing blue carrots.  
        BasilSrfLandedcrateBasin = The ground here is significantly harder and more solid that it is on other parts of the moon.  It would seem these larger impacts have blown away Basils surface-coating of dust and pebbles, and revealed the moons bedrock.  
        BasilSrfLandedcrateSmall = You collect a surface sample.  The sand here shows signs of heat exposure, having sintered into large flakey flakes.  
        BasilSrfLandedHIGH = You take a sample of this loose, fine dust that covers the ground.  You wonder how deep the dust actually is up here.  
        BasilSrfLandedMID = The ground here is made up of sharp, almost-microscopic dust.  You recall an old KSA horror story of a Kerbanaut that was exposed to some similar Munar regolith, and had to spend the rest of his life in a big tube.  
        BasilSrfLandedLOW = You grab a handful of rough gravel and drop it into a sample bag.  

        OllaganderSrfLandedA = The land here is made up of tiny rock particles, bound up in water ice.  You gather up some loose material and watch it melt into muddy goop in the sunlight.  
        OllaganderSrfLandedE = The ground here is ever so slightly soft and molten, giving it the texture of half-set play-dough.  You grab a mittful and stuff it in a sample tube.  
        OllaganderSrfLandedU = The land here is made up of tiny rock particles, bound up in water ice.  You gather up some loose material and watch it melt into muddy goop in the sunlight.  
        OllaganderSrfLandedCLAY = You pull out your trusty ice cream scoop and collect a sample of the squishy ground.  
        OllaganderSrfLanded = You chip off some fragments of the hardened crater floor, and drop them into a sample back.  Seeing all those little pieces of fired clay remind you of the time you dropped a plant pot and scared the cat so much it jumped out the window and never came back.  

        LemaSrfLandedbCrate = You slop a handful of the slushy ground into a sample tube, before wiping your hands off on your spacesuit.   
        LemaSrfLandedSLOPE = You take a sample of fine, pinkish-white snow.  You wish you brought a spoon.  
        LemaSrfLandedPEAKS = You take a sample of fine, pinkish-white snow.  You wish you brought a spoon.  
        LemaSrfLandedMOUNT = You take a sample of fine, pinkish-white snow.  You wish you brought a spoon.  
        LemaSrfLanded = You take a surface sample.  You notice that the ice here is a little oily.  
        LemaSrfLandedFLOOR = You take a couple surface samples; one for here and one to go.  
        LemaSrfLandedNORTH = The ice here is particularly... glittery, And freezing.  

        RunSrfLandedSMUSH = The soil here, perhaps unsurprisingly, resembles a loose mixture of the two moonlets.  You wonder if you should take a new sample or just mix up some of the one you've already got - like mixing white and red wine to make Rosé.  
        RunSrfLandedDASH = You take a sample.  It appears to be a mixture of powdery grey clay, and chunks of pumice-like stone.  You bet it would make a hell of an exfoliator.  
        RunSrfLandedDART = You collect a sample.  This side of the moon seems to mostly just be reddy-brown clay.  Good for bricks, maybe?  Brown bricks?  
        RunSrfLandedCLIFF = You cuss the KSA out for asking you to take a surface sample from a sheer cliff.  What are you meant to do, climb the thing like a goat?  There is only one goat and his name is LeBron.  
        RunSrfLandedSPECIAL = You go to take a sample, but then hesitate.  The dark coldness that you've felt since you entered this area grips you tighter.  No... It would be a bad idea to take a sample from here... 

        SixleSrfLandedPR = You scoop up a sample of fine, dark-coloured oxide dust.  You feel a little extra grateful for your space suit.  
        SixleSrfLandedSR = You can't break the surface to take a sample.  The best you can do is leave a nasty scratch.  
        SixleSrfLandedCRATE = You manage to scrape some burnt-looking dust off the surface.  It appears to be a mixture of unusual minerals and metallic oxides that you can't quite identify...  

        HilliSrfLandedBH = You can't break the surface to take a sample, but you CAN leave a hell of a dent!  
        HilliSrfLandedPR = You scoop up a sample of reddish-brown oxide dust.  It reminds you of cheap Cocoa.  

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    @RESULTS
    {
        KnuraFlyingLowCD = The sky is utterly black within these clouds.  Between the slamming rain and the hurricane-force wind, you're starting to wonder why you went on EVA.  
        KnuraFlyingLowCB = The air here is thick with water mist.  Light is managing to pass through the haze, but you're struggling to see very far ahead.  All-in-all, it's not nearly as enjoyable as you thought it would be.   
        KnuraFlyingLowCS = The breaks in the cloud cover allow you to observe the majesty of your surroundings - bright white and deep grey towers of cloud, edged with intricate soft detail, stretch for miles above and below you, and extend into the infinite horizon.  Above you, past the Kerbin-like blue sky, you see the Knuras ring system arching from one vanishing point to another.     
        KnuraFlyingHighCD = The sky below you looks quite angry.  You quietly hope you don't need to go much deeper.  
        KnuraFlyingHighCB = The sky below you looks like a great big feather pillow.  You quietly wish you could go a little deeper.  
        KnuraFlyingHighCS = At this high altitude, the atmospheric pressure is not all that high.  You half-expect an air hostess to give you a bag of peanuts.  
        KnuraInSpaceLow = Your entirely field of vision begins to fill with bright blue and white streaks.  You notice the puffy haze of Knuras atmosphere rising above the cloud layer, blurring the star beyond.  
        KnuraInSpaceHigh = From here, Knura appears as a giant disk of blue and white, surrounded by two thin white ribbons and half a dozen coloured beads, making for a very poetic scene.  

        HopInSpaceLow = Between the light from the sun, and the reflected light from Knura, the surface of Hop is little more than a blinding white blur.  
        HopInSpaceLowAR = A thin ridge of accreted ring material circles Hops equator like a trendy white belt.  You hope your orbit is high enough to miss it... 
        HopInSpaceHigh = This little snowball is blindingly bright.  You don't much enjoy looking at it from up here.  
        HopSrfLanded= All around you are rolling hills, covered is fluffy white snow.  It's a winter wonderland!  
        HopSrfLandedAR = On this high ridge, You feel as if one ill-timed booster-fire would send you pirouetting off into Knura.  

        SkipInSpaceLow = The surface is a little less blinding than Hops, but that isn't saying all that much.  Staring directly into the sun might be a little less blinding than looking at Hop.  
        SkipInSpaceHigh = From here, Skip looks like a mottled white-and-brown wad of chewing gum.  
        SkipSrfLanded = The snowy fields around you are split up by the occasional dirty brown patch of bare rock.  Knura looms frighteningly overhead.  
        SkipSrfLandedHydroD = There is a fine scattering of an oily sand here, sitting atop the ice layer.  Something must have happened quite recently to put it there... 

        GlothFlyingLowssSea_wet = This far from land, you find that the atmosphere is almost dead-still.  You're slightly amazed that for a moon with such a large liquid ocean and such a thick atmosphere, Gloth has virtually no weather.  It's like a big stagnant puddle, just barely stirred by convection and kept lukewarm by the sun.  No wonder it's covered in mould.   
        GlothFlyingLowoSea_wet = This far from land, you find that the atmosphere is almost dead-still.  You're slightly amazed that for a moon with such a large liquid ocean and such a thick atmosphere, Gloth has virtually no weather.  It's like a big stagnant puddle, just barely stirred by convection and kept lukewarm by the sun.  No wonder it's covered in mould.   
        GlothFlyingLow = The dark lakes trap more heat than the light-colour land, resulting in a constant slight upward draft when flying over seas and lakes, and a faint downwash over land. 
        GlothFlyingLowrCrateL_wet = From here, Renés Crater looks less like a crater and more like a continent-scale spiral, curling in and around on itself before shooting back down south.  In the centre of this natural bay is Odo Island, a location of significance to dozens of sci-fi fans back on Kerbin.
        GlothFlyingLowmiscL_wet = The landscape is pitted with dozens of little black-green spots.  It reminds you of looking in the mirror back in high school.  
        GlothFlyingLowrCrate = From here, Renés Crater looks less like a crater and more like a huge twisting spiral, curling in and around on itself before shooting back down south.  In the centre of this natural bay is Odo Island, a location of significance to dozens of sci-fi fans back on Kerbin.  
        GlothFlyingLowSPECIAL = From here, Renés Crater looks less like a crater and more like a huge twisting spiral, curling in and around on itself before shooting back down south.  Directly below you is Odo Island, a location of significance to dozens of sci-fi fans back on Kerbin, and throughout the universe.  
        GlothFlyingLowBIGSHROOM = Dodging between these giant mushrooms makes you feel like some kind of Super Mario ಠ_ಠ
        GlothFlyingHigh = Gloths atmosphere  is so thick, and its gravity so low, that reentry for orbit velocities is downright trivial.  Heck, you barely need a parachute.  We did pack a parachute though, right? 
        GlothInSpaceLowssSea_wet = Through the hazy yellow atmosphere and thin equatorial clouds, you can clearly make out the green-black expanse of the Super-Sargasso Sea, broken up by the fractal coastlines of a thousand islands.  It reminds you of a classroom map of Kerbin that was left out in the sun too long.
        GlothInSpaceLowoSea_wet = Despite covering Gloths northern pole, the Omarion Sea seems to show no signs of any sort of "icecap".  Well... technically the entire moon is made of ice, and the sea is made of oil.  It has no... fat cap?  Cream cap?  Yuck... 
        GlothInSpaceLow = As the world rolls by below you, you notice that it doesn't have any distinct continents or nicely-shaped land masses like Kerbin.  It is a checkerboard of lakes, seas and islands, all shepherded by one long, twisting landmass. 
        GlothInSpaceLowrCrateL_wet = From here, you notice that Renés Crater resemble a huge dart board - side from the obvious central island and crater wall, there is a second crater lake and wall system further out.  It must have been one heck of an impact to get through the atmosphere.
        GlothInSpaceLowCAT_wet = You let out an involuntary nyahh.  You hope KSA didn't hear that. 
        GlothInSpaceLowrCrate = From here, you notice that Renés Crater resemble a huge dart board - side from the obvious central island and crater wall, there is a second crater lake and wall system further out.  It must have been one heck of an impact to get through the atmosphere.
        GlothInSpaceLowBIGSHROOM = You think you can just about make out some big, green dots on the landscape below you.  
        GlothInSpaceHigh = Through the fuzzy haze of yellow atmosphere, you can make out a patchwork pattern of black and... more yellow.  This is undoubtedly one of the yellowest moons you've ever seen.  
        GlothSrfSplashedssSea_wet = As you bob around in this inky-green expanse, you wonder what secrets might lie below its surface.  Lost cities?  Ancient crashed spaceships?  A vast collection of balled-up socks and car keys?  The possibilities are endless.
        GlothSrfSplashedoSea_wet = You're not sure why, but you feel drawn to the sea here.  Like its calling to you... 
        GlothSrfSplashedMR_wet = The surface liquid on Gloth appears to be an inky-green hydrocarbon, with the consistency of warm honey.  You can't quite decide if it's a gooey oil, or an oily goo.  
        GlothSrfSplashedMM_wet = The liquid isn't quite entirely opaque, but you don't need to swim very deep before you can't see past your helmet.  You can't imagine anything lives down here.  Anything big, that is.  
        GlothSrfSplashedMS_wet = Analysis of the oily substance reveals long chain hydrocarbons, acidic compounds, and various proteins.  Your conclusion is that it must be some kind of Mayonnaise.  
        GlothSrfSplashedLA_wet = The greenish hue of the oil seems to come from a buildup of fungal spores.  That must be why there are so many mushrooms around the coast!  
        GlothSrfSplashedrCrateL_wet = The tall, almost-complete crater rim shelters this bay from the elements, leaving its surface glassy and still.  You feel like a raisin stuck in jelly.  
        GlothSrfSplashedmiscL_wet = This lake is so small that it's almost entirely still, with the wind just barely agitating the surface. 
        GlothSrfSplashedCAT_wet = Is the warmer here?  Gross...
        GlothSrfLandedcat = This mod was made my Hermaeus Jackson and was started on the 25th of January 2025 (or at least thats the date on Knuras texture, which was the first asset i created).  I originally made a planet pack using Kragrathea, the predecessor to this mod, back in 2017, and have been meaning to get back to it in all the time since.  It feels very unbelievably to come back to the hobby after all time and see the mod-space in such a rich, mature state.  This game looks FANTASTIC now, it's almost witchcraft.
        GlothSrfLandedHIGH = The ice here is quite clean compared to what you can find towards the coast, giving it an almost-clean appearance. You think about making a snow angel, but you remember that you don't have a washing machine in the ship.   
        GlothSrfLandedMID = The ice here has been weathered into tiny particles, and dusted with an oily yellow layer of hydrocarbons and all sorts of strange, sticky molecules.  It almost looks like a beach!  Sort of... 
        GlothSrfLandedLOW = The coast is lined with glades of giant mushrooms, all covered in hanging lichens and soaking up whatever little sunlight they can with their great, green caps.  The sand here has been stained green by the sea, giving the scene a distinctive "coastal forest meets week-old sandwich" aesthetic.  
        GlothSrfLandedrCrate = The crater rim forms an almost complete ring, with just a small opening to the south.  Around you are reddish-brown clumps of ice, and small, friendly-looking mushrooms.  You can't help but wonder how big the asteroid was that got through Gloths atmosphere and still made this large of a crater. 
        GlothSrfLandedSPECIAL = This island is quiet, and very serene.  You could see yourself spending some time here.  
        GlothSrfLandedaCrate = This half-crater reminds you of a beach-side holiday you went on when you were just a little homunculus.  
        GlothSrfLandedjCrate = Most of this crater has been worn away by the gentle ebbing of the Super-Sargasso Sea, leaving just a little Mün shape
        GlothSrfLandedBIGSHROOM = Something about the geography here has allowed the mushrooms to grow to an incredible size.  KSA advices against trying to climb one of them.  Spoil-sports... 

        ChopleInSpaceLowCRAGGLE = The land below you is interrupted by a dark, smudgy streak.  You try breathing on the crew-cabin window and wiping it clean, but you end up fogging up your helmet, missing the window and punching the wall.  
        ChopleInSpaceLow = The ground appears to be made out of the purest green.  
        ChopleInSpaceHigh = The sculpted turquoise facets of Choples surface catch the suns rays as you drift, sending scattered flashes of light across the cabin walls.  
        ChopleSrfLandedCRAGGLE = You can see the icy-smooth ground beneath you extend out into the distance, before rising into cliff walls.  
        ChopleSrfLandedHIGH = What at first appeared to be a flat, glassy surface has turned out to be a field of shattered glass, rising from the ground like a thousand tiny scalpels.  You don't need to walk around out there, do you?  
        ChopleSrfLandedvHigh = The ground here has an unpleasantly rough texture, like a sponge made out of glass.  The lander sinks in with a crackle.  
        ChopleSrfLandedMID = You notice obtuse ridges in the ground, a few inches tall and spaced a metre or so apart.  You recall something you were taught about in high school... Ballner lines?  Kallner lines?  Something like that.  
        ChopleSrfLandedLOW = The ground here is much smoother and clearer than on the rest of the moon.  You can feel the lander sliding ever so slowly across the surface, as if you've touched down on an ice-rink.  

        BasilInSpaceLowMAR = You see a large, dark scar on the moons surface.  It almost looks like... Oh!  Now I get it!  
        BasilInSpaceLow = The moon below you is a speckled mess of craters and basins; bright and dark patches overlapping each other.  It looks like a big piece of mouldy bread.  
        BasilInSpaceHigh = Basil reminds you quite a lot of the Mün, except someone blue it up.  Haw haw.  
        BasilSrfLandedMAR = The land here is dark and flat, broken only by countless strange spherical rock formations - some lying on the ground, and others sitting atop tall stalks.  They almost look like stony mushrooms.  
        BasilSrfLandedcrateBasin = You seem to have landed in some kind of giant hole.  
        BasilSrfLandedcrateSmall = You seem to have landed in some kind of glorified ditch.  
        BasilSrfLandedHIGH = The view from here is spectacular.  Endless rolling craters, pockmarks and valleys, as far as the eye can see.  It's just like high school!  
        BasilSrfLandedMID = The lander kicked up so much dust as it came down that you can barely see three feet out the cabin window.  
        BasilSrfLandedLOW = The soil here is dark and gritty.  In your opinion, this lends the whole area a serious, brutal and realistic tone, which is far more appealing and unique than what we got in retail.  Wait... what are we talking about again?  

        OllaganderInSpaceLowA = This part of the moon looks... feathery.  
        OllaganderInSpaceLowE = This part of the moon looks... horsey.  
        OllaganderInSpaceLowU = This part of the moon looks... bearish.  
        OllaganderInSpaceLow = This part of the moon looks... like the mod author couldn't think of any more jokes.  
        OllaganderInSpaceHigh = Looking down at Ollagander, as it drifts past the blue-white disk of Knura, reminds you of damp concrete under the clear, cold sky of home.  
        OllaganderSrfLanded = As you look out across the landscape, you feel an overwhelming sense of... grey.  bleh.  
        OllaganderSrfLandedCLAY = The ground here is so soft that the lander sinks a good few inches as it comes down.  I hope this stuff doesn't freezer over night... 
        OllaganderSrfLandedwCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery.  You like this crater a lot.  You find its character is heart-wrenchingly tragic and evocative.  
        OllaganderSrfLandedkCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedcCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedhCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedbCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedmCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedhetCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery.  You don't like this crater very much.  You feel its character is poorly fleshed out and under-explored.  You also feel the retroactive character-building that was done in the fourth book, which was clearly not what Dan intended for the character in the first book, was one of the weakest and hockiest plot-points of the entire series.  Sorry, I got off-topic for a second there.  What I'm trying to say is this crater sucks eggs.  

        LemaInSpaceLow = You can smell the artificial Blueberry flavour from here.  Are you sure the airlock is working?  
        LemaInSpaceLowNORTH = You can just about see some small - or rather big, if you can see them from here - crystals on the surface.  
        LemaInSpaceHigh = You feel like you remember coughing up something that looked like Lema once.  
        LemaSrfLandedbCrate = This crater was formed by a truly ancient impact event, from the very earliest years of the Knura system.  You wonder if these ancient impacts are what gave Lema its rings.  
        LemaSrfLandedSLOPE = You have to hand it to the KSA - these landing legs are STICKY! 
        LemaSrfLandedPEAKS = As you shut off your ships engines, the lander drops the final few feet to the ground before embedding itself a further few feet into puff of white-purple snow.  I hope someone packed a shovel.  
        LemaSrfLandedMOUNT = This solitary mountain appears to be the tallest on Lema, having been formed by three nearby impacts pushing up a single pillar of ice.  This would be the perfect place for sleighing.  
        LemaSrfLanded = Between the tall snowy hills and the appetising colour of the ground, you are reminded a bit of Minmus.  
        LemaSrfLandedFLOOR = The ground here is remarkably liquid.  You're surprised the lander isn't bobbing around like a cork.  
        LemaSrfLandedNORTH = These mountains are covered in giant spires of snow and ice.  There must be something special about the environment here that allows them to grow this tall.  

        RunSrfLandedSMUSH = The ground is a mixture of big and small boulders from both Dart and Dash, all mixed up with a frozen clay.  With the two moonlets looming over you, you feel a little claustrophobic.  
        RunSrfLandedDASH = This half of Run is made up of a powdery, dark grey rock, like a pumice stone thats been smushed full of clay.  You hope none of it gets stuck in anything important.   
        RunSrfLandedDART = This moonlet is far less rocky than its counterpart.  Instead, it's mostly made up of reddish mud, speckled with the occasional chunk of rock and ice.  You wonder if it used to be part of a bigger, wetter moon.   
        RunSrfLandedCLIFF = Once upon a time, this would have just been an unremarkable plot of land on Dash.  But since the collision it's become a terrifying cliff, rising at an almost perfect right-angle from Runs centre of gravity.  How on Kerbin did you manage to land here?  
        RunSrtLandedSPECIAL = A shiver runs up your spine, like a cold wind cut you through your spacesuit and down to your very core.  You don't know why, but this particular spot makes you feel... alone.  Uneasy.  Like time itself has left you, and you've become lost in a dark place.  Lost in... 1970s east coast Scotland.  My god... 
        RunInSpaceLow = Runs oblong shape means that even a nice, circular orbit brings your perilously close to the surface.  Seeing its lobes swing towards you at hundreds of metres per second is always a stomach-churning experience.  
        RunInSpaceHigh = From up here you can clearly see what makes this remote asteroid so special - its made up of two clearly delineated bodies - nicknamed Dart and Dash - that at some point crashed together so gently that they retained their original shapes, leaving behind the impressively peanut-shaped Run.  

        SixleInSpaceLow = Sixles surface is a swirled mix of brilliant bright ridges, and dusty black ravines.  It looks like an old, fancy silver cup.  
        SixleInSpaceLowCRATE = You spot an unusual feature on Sixles otherwise jewel-like surface - a vast crater, stained a greyish black.  What could have blown such a hole out of this big metal ball?  
        SixleInSpaceHigh = As Hilli and Sixle turn below you, random flashes of reflected sunlight jump from their surface and try their best to blind you. 
        SixleSrfLandedPR = These low areas are filled with the powdery, oxidised ejecta of countless impacts.  
        SixleSrfLandedSR = Touching down here was remarkable uncomfortable - like riding a bike with no suspension of a cobble road.  
        SixleSrfLandedCRATE = Darkness and an insidious cold fills the cabin, as all direct sunlight is cut out by the towering crater walls.  

        HilliInSpaceLow = Even this near the surface, Hilli still looks small.  It's a small, lumpy, slightly squat ball of brassy metal.  
        HilliInSpaceHigh =  As Hilli and Sixle turn below you, random flashes of reflected sunlight jump from their surface and try their best to blind you.  
        HilliSrfLandedBH = The ground here is hard, shiny, and distressingly slippery.  
        HilliSrfLandedPR = These low areas are filled with the powdery, oxidised ejecta of countless impacts.  

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    @RESULTS
    {
        KnuraFlyingLowCD = The sky is utterly black within these clouds.  Between the slamming rain and the hurricane-force wind, you're starting to wonder why you went on EVA.  
        KnuraFlyingLowCB = The air here is thick with water mist.  Light is managing to pass through the haze, but you're struggling to see very far ahead.  All-in-all, it's not nearly as enjoyable as you thought it would be.   
        KnuraFlyingLowCS = The breaks in the cloud cover allow you to observe the majesty of your surroundings - bright white and deep grey towers of cloud, edged with intricate soft detail, stretch for miles above and below you, and extend into the infinite horizon.  Above you, past the Kerbin-like blue sky, you see the Knuras ring system arching from one vanishing point to another.     
        KnuraFlyingHighCD = The sky below you looks quite angry.  You quietly hope you don't need to go much deeper.  
        KnuraFlyingHighCB = The sky below you looks like a great big feather pillow.  You quietly wish you could go a little deeper.  
        KnuraFlyingHighCS = At this high altitude, the atmospheric pressure is not all that high.  It almost feels like skydiving back on Kerbin - nothin' by blue sky.  
        KnuraInSpaceLow = Your entirely field of vision begins to fill with bright blue and white streaks.  You notice the puffy haze of Knuras atmosphere rising above the cloud layer, blurring the star beyond.  
        KnuraInSpaceHigh = From here, Knura appears as a giant disk of blue and white, surrounded by two thin white ribbons and half a dozen coloured beads, making for a very poetic scene.  You feel you'd be able to appreciate it more if it wasn't for the tiny rocks and snowballs constantly pelting your visor.  

        HopInSpaceLow = Between the light from the sun, and the reflected like from Knura, the surface of Hop looks like little more than a blinding white blur.  
        HopInSpaceLowAR = A thin ridge of accreted ring material lines Hops equator like a trendy white bent.  You hope your orbits high enough to miss it... 
        HopInSpaceHigh = This little snowball and blindingly bright.  You don't much enjoy looking at it from up here.  
        HopSrfLanded= All around you are rolling hills, covered is fluffy white snow.  It's a winter wonderland!  
        HopSrfLandedAR = On this high ridge, You feel as if one ill-timed step would send you pirouetting off into Knura.  

        SkipInSpaceLow = The surface is a little less blinding than Hops, but that isn't say all that much.  Staring at the sun might be a little less blinding than looking at Hop.  
        SkipInSpaceHigh = From here, Skip looks like a mottled white-and-brown wad of chewing gum.  
        SkipSrfLanded = The snowy fields around you are split up but the occasional dirty brown patch of bare rock.  Knura looms frighteningly overhead.  
        SkipSrfLandedHydroD = There is a fine scattering of an oily sand here, sitting atop the ice layer.  Something must have happened quite recently to put it there... 

        GlothFlyingLowssSea_wet = This far from land, you find that the atmosphere is almost dead-still.  You're slightly amazed that for a moon with such a large liquid ocean and such a thick atmosphere, Gloth has virtually no weather.  It's like a big stagnant puddle, just barely stirred by convection and kept lukewarm by the sun.  No wonder it's covered in mould.   
        GlothFlyingLowoSea_wet = This far from land, you find that the atmosphere is almost dead-still.  You're slightly amazed that for a moon with such a large liquid ocean and such a thick atmosphere, Gloth has virtually no weather.  It's like a big stagnant puddle, just barely stirred by convection and kept lukewarm by the sun.  No wonder it's covered in mould.   
        GlothFlyingLow = The dark lakes trap more heat than the light-colour land, resulting in a constant slight upward draft when flying over seas and lakes, and a faint downwash over land. 
        GlothFlyingLowrCrateL_wet = From here, Renés Crater looks less like a crater and more like a huge twisting spiral, curling in and around on itself before shooting back down south.  In the centre of this natural bay is Odo Island, a location of significance to dozens of sci-fi fans back on Kerbin.
        GlothFlyingLowmiscL_wet = The landscape is pitted with dozens of little black-green spots.  It reminds you of looking in the mirror back in high school.  
        GlothFlyingLowrCrate = From here, Renés Crater looks less like a crater and more like a huge twisting spiral, curling in and around on itself before shooting back down south.  In the centre of this natural bay is Odo Island, a location of significance to dozens of sci-fi fans back on Kerbin.  
        GlothFlyingLowSPECIAL = From here, Renés Crater looks less like a crater and more like a huge twisting spiral, curling in and around on itself before shooting back down south.  Directly below you is Odo Island, a location of significance to dozens of sci-fi fans back on Kerbin, and throughout the universe.  
        GlothFlyingLowBIGSHROOM = Dodging between these giant mushrooms makes you feel like some kind of Super Mario ಠ_ಠ
        GlothFlyingHigh = Gloths atmosphere is so thick, and its gravity so low, that reentry for orbit velocities is downright trivial.  Heck, you barely need a parachute.  We did pack a parachute though, right? 
        GlothInSpaceLowssSea_wet = Through the hazy yellow atmosphere and thin equatorial clouds, you can clearly make out the green-black expanse of the Super-Sargasso Sea, broken up by the fractal coastlines of a thousand islands.  It reminds you of a classroom map of Kerbin that was left out in the sun too long.
        GlothInSpaceLowoSea_wet = Despite covering Gloths northern pole, the Omarion Sea seems to show no signs of any sort of "icecap".  Well... technically the entire moon is made of ice, and the sea is made of oil.  It has no... fat cap?  Cream cap?  Yuck... 
        GlothInSpaceLow = As the world rolls by below you, you notice that it doesn't have any distinct continents or nicely-shaped land masses like Kerbin.  It is a checkerboard of lakes, seas and islands, all shepherded by one long, twisting landmass. 
        GlothInSpaceLowrCrateL_wet = From here, you notice that Renés Crater resemble a huge dart board - side from the obvious central island and crater wall, there is a second crater lake and wall system further out.  It must have been one heck of an impact to get through the atmosphere.
        GlothInSpaceLowCAT_wet = You let out an involuntary nyahh.  You hope KSA didn't hear that. 
        GlothInSpaceLowrCrate = From here, you notice that Renés Crater resemble a huge dart board - side from the obvious central island and crater wall, there is a second crater lake and wall system further out.  It must have been one heck of an impact to get through the atmosphere.
        GlothInSpaceLowBIGSHROOM = You think you can just about make out some big, green dots on the landscape below you.  
        GlothInSpaceHigh = Through the fuzzy haze of yellow atmosphere, you can make out a patchwork pattern of black and... more yellow.  This is undoubtedly one of the yellowest moons you've ever seen.  
        GlothSrfSplashedssSea_wet = As you bob around in this inky-green expanse, you wonder what secrets might lie below its surface.  Lost cities?  Ancient crashed spaceships?  A vast collection of balled-up socks and car keys?  The possibilities are endless.
        GlothSrfSplashedoSea_wet = You're not sure why, but you feel drawn to the sea here.  Like its calling to you... 
        GlothSrfSplashedMR_wet = The surface liquid on Gloth appears to be an inky-green hydrocarbon, with the consistency of warm honey.  You can't quite decide if it's a gooey oil, or an oily goo.  
        GlothSrfSplashedMM_wet = The liquid isn't quite entirely opaque, but you don't need to swim very deep before you can't see past your helmet.  You can't imagine anything lives down here.  Anything big, that is.  
        GlothSrfSplashedMS_wet = Analysis of the oily substance reveals long chain hydrocarbons, acidic compounds, and various proteins.  Your conclusion is that it must be some kind of Mayonnaise.  
        GlothSrfSplashedLA_wet = The greenish hue of the oil seems to come from a buildup of fungal spores.  That must be why there are so many mushrooms around the coast!  
        GlothSrfSplashedrCrateL_wet = The tall, almost-complete crater rim shelters this bay from the elements, leaving its surface glassy and still.  You feel like a raisin stuck in jelly.  
        GlothSrfSplashedmiscL_wet = This lake is so small that it's almost entirely still, with the wind just barely agitating the surface. 
        GlothSrfSplashedCAT_wet = Is the warmer here?  Gross...
        GlothSrfLandedcat = This mod was made my Hermaeus Jackson and was started on the 25th of January 2025 (or at least thats the date on the original Knura texture, which was the first asset i created).  I originally made a planet pack using Kragrathea, the predecessor to this mod, back in 2017, and have been meaning to get back to it in all the time since.  It feels very unbelievably to come back to the hobby after all time and see the mod-space in such a rich, mature state.  This game looks FANTASTIC now, it's almost witchcraft.
        GlothSrfLandedHIGH = The ice here is quite clean compared to what you can find towards the coast, giving it an off-white appearance. You think about making a snow angel, but you remember that you don't have a washing machine in the ship.   
        GlothSrfLandedMID = The ice here has been weathered into tiny particles, and dusted with an oily yellow layer of hydrocarbons and all sorts of strange, sticky molecules.  It almost looks like a beach!  Sort of... 
        GlothSrfLandedLOW = The coast is lined with glades of giant mushrooms, all covered in hanging lichens and soaking up whatever little sunlight they can with their great, green caps.  The sand here has been stained green by the sea, giving the scene a distinctive "coastal forest meets week-old sandwich" aesthetic.  
        GlothSrfLandedrCrate = The crater rim forms an almost complete ring, with just a small opening to the south.  Around you are reddish-brown clumps of ice, and small, friendly-looking mushrooms.  You can't help but wonder how big the asteroid was that got through Gloths atmosphere and still made this large of a crater. 
        GlothSrfLandedSPECIAL = This island is quiet, and very serene.  You could see yourself spending some time here.  
        GlothSrfLandedaCrate = This half-crater reminds you of a beach-side holiday you went on when you were just a little homunculus.  
        GlothSrfLandedjCrate = Most of this crater has been worn away by the gentle ebbing of the Super-Sargasso Sea, leaving just a little Mün shape
        GlothSrfLandedBIGSHROOM = Something about the geography here has allowed the mushrooms to grow to an incredible size.  KSA advices against trying to climb one of them.  Spoil-sports... 

        ChopleInSpaceLowCRAGGLE = The land below you is interrupted by a dark, smudgy streak.  You instinctively wipe your visor, just in case.  
        ChopleInSpaceLow = The ground appears to be made out of the purest green.  
        ChopleInSpaceHigh = The sculpted turquoise facets of Choples surface catch the suns rays as you drift, sending scattered flashes of light across your visor.  
        ChopleSrfLandedCRAGGLE = You can see the icy-smooth ground beneath you extend out into the distance, before rising into cliff walls.  You feel like a spider trapped in a big bowl.  
        ChopleSrfLandedHIGH = What at first appeared to be a flat, glassy surface has turned out to be a field of shattered glass, rising from the ground like a thousand tiny scalpels.  Are our spacesuits designed for this?  
        ChopleSrfLandedvHigh = The ground here has an unpleasantly rough texture, like a sponge made out of glass.  
        ChopleSrfLandedMID = You notice obtuse ridges in the ground, a few inches tall and spaced a metre or so apart.  You recall something you were taught about in high school... Ballner lines?  Kallner lines?  Something like that.  
        ChopleSrfLandedLOW = The ground here is much smoother and clearer than on the rest of the moon.  Looking down, you can see all manners of faults and slips just below the surface.  

        BasilInSpaceLowMAR = You see a large, dark scar on the moons surface.  It almost looks like... Oh!  Now I get it!  
        BasilInSpaceLow = The moon below you is a speckled mess of craters and basins; bright and dark patches overlapping each other.  It looks like a big piece of mouldy bread.  
        BasilInSpaceHigh = Basil reminds you quite a lot of the Mün, except someone blue it up.  Haw haw.  
        BasilSrfLandedMAR = The land here is dark and flat, broken only by countless strange spherical rock formations.  You feel an overwhelming urge to try kicking one as hard as you can.  
        BasilSrfLandedcrateBasin = You seem to have gotten stuck in some kind of giant hole.  
        BasilSrfLandedcrateSmall = You seem to have gotten stuck in some kind of glorified ditch.  
        BasilSrfLandedHIGH = The view from here is spectacular.  Endless rolling craters, pockmarks and valleys, as far as the eye can see.  It's just like high school!  
        BasilSrfLandedMID = The ground here is so dusty and loose that you struggle to find a solid footing.  
        BasilSrfLandedLOW = The soil here is dark and gritty.  In your opinion, this lends the whole area a serious, brutal and realistic tone, which is far more appealing and unique than what we got in retail.  Wait... what are we talking about again?  

        OllaganderInSpaceLowA = This part of the moon looks... feathery.  
        OllaganderInSpaceLowE = This part of the moon looks... horsey.  
        OllaganderInSpaceLowU = This part of the moon looks... bearish.  
        OllaganderInSpaceLow = This part of the moon looks... like the mod author couldn't think of any more jokes.  
        OllaganderInSpaceHigh = Looking down at Ollagander, as it drifts past the blue-white disk of Knura, reminds you of damp concrete under the clear, cold sky of home.  
        OllaganderSrfLanded = As you look out across the landscape, you feel an overwhelming sense of... grey.  bleh.  
        OllaganderSrfLandedCLAY = The ground here is so soft that your feet sink into the mud.  You're sure that if Ollagander had an atmosphere, it would be making a very funny noise.  
        OllaganderSrfLandedwCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery.  You like this crater a lot.  You find its character is heart-wrenchingly tragic and evocative.  
        OllaganderSrfLandedkCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedcCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedhCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedbCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedmCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery. 
        OllaganderSrfLandedhetCrate = The event that formed this crater was energetic enough to sublimate out all of the surface water and ice, giving the crater walls the texture of fired pottery.  You don't like this crater very much.  You feel its character is poorly fleshed out and under-explored.  You also feel the retroactive character-building that was done in the fourth book, which was clearly not what Dan intended for the character in the first book, was one of the weakest and hockiest plot-points of the entire series.  Sorry, I got off-topic for a second there.  What I'm trying to say is this crater sucks eggs.  

        LemaInSpaceLow = You can smell the artificial Blueberry flavour from here.  
        LemaInSpaceLowNORTH = You can just about see some small - or rather big, if you can see them from here - crystals on the surface.  
        LemaInSpaceHigh = You feel like you remember coughing up something that looked like Lema once.  
        LemaSrfLandedbCrate = This crater was formed by a truly ancient impact event, from the very earliest years of the Knura system.  You wonder if these ancient impacts are what gave Lema its rings.  
        LemaSrfLandedSLOPE = You really should have brought Crampons or something.  
        LemaSrfLandedPEAKS = You feel an overwhelming urge to scoop up a handful of snow and eat it.  
        LemaSrfLandedMOUNT = This solitary mountain appears to be the tallest on Lema, having been formed by three nearby impacts pushing up a single pillar of ice.  This would be the perfect place for sleighing.  
        LemaSrfLanded = Between the tall snowy hills and the appetising colour of the ground, you are reminded a bit of Minmus.  
        LemaSrfLandedFLOOR = The ground here is remarkably liquid.  It's like walking around in a  giant frosted milkshake.  
        LemaSrfLandedNORTH = These mountains are covered in giant spires of snow and ice.  There must be something special about the environment here that allows them to grow this tall.  

        RunSrfLandedSMUSH = The ground is a mixture of big and small boulders from both Dart and Dash, all mixed up with a frozen clay.  With the two moonlets looming over you, you feel a little claustrophobic.  
        RunSrfLandedDASH = This half of Run is made up of a powdery, dark grey rock, like a pumice stone thats been smushed full of clay.  You're quite sure that your suit would rip if you snagged it on anything, so you start watching your step.   
        RunSrfLandedDART = This moonlet is far less rocky than its counterpart.  Instead, it's mostly made up of reddish mud, speckled with the occasional chunk of rock and ice.  You wonder if it used to be part of a bigger, wetter moon.   
        RunSrfLandedCLIFF = Once upon a time, this would have just been an unremarkable plot of land on Dash.  But since the collision it's become a terrifying cliff, rising at an almost perfect right-angle from Runs centre of gravity.  How on Kerbin did you manage to land here?  
        RunSrtLandedSPECIAL = A shiver runs up your spine, like a cold wind cut you through your spacesuit and down to your very core.  You don't know why, but this particular spot makes you feel... alone.  Uneasy.  Like time itself has left you, and you've become lost in a dark place.  Lost in... 1970s east coast Scotland.  My god... 
        RunInSpaceLow = Runs oblong shape means that even a nice, circular orbit brings your perilously close to the surface.  Seeing its lobes swing towards you at hundreds of metres per second is always a stomach-churning experience.  
        RunInSpaceHigh = From up here you can clearly see what makes this remote asteroid so special - its made up of two clearly delineated bodies - nicknamed Dart and Dash - that at some point crashed together so gently that they retained their original shapes, leaving behind the impressively peanut-shaped Run.  

        SixleInSpaceLow = Sixles surface is a swirled mix of brilliant bright ridges, and dusty black ravines.  It looks like an old, fancy silver cup.  
        SixleInSpaceLowCRATE = You spot an unusual feature on Sixles otherwise jewel-like surface - a vast crater, stained a greyish black.  What could have blown such a hole out of this big metal ball?  
        SixleInSpaceHigh = As Hilli and Sixle turn below you, random flashes of reflected sunlight jump from their surface and try their best to blind you. 
        SixleSrfLandedPR = These low areas are filled with the powdery, oxidised ejecta of countless impacts.  Walking here feels like walking freshly laid snow.  
        SixleSrfLandedSR = When you look down, you see a wobbly reflection of the stars above you.  And of course your own handsome mug.  
        SixleSrfLandedCRATE = You look around - steep, blackened crater walls rise above you in all directions, melted out from the steely ground by some terrible event.  

        HilliInSpaceLow = Even this near the surface, Hilli still looks small.  It's a small, lumpy, slightly squat ball of brassy metal.  
        HilliInSpaceHigh =  As Hilli and Sixle turn below you, random flashes of reflected sunlight jump from their surface and try their best to blind you.  
        HilliSrfLandedBH = The ground here is hard, shiny, and distressingly slippery.  
        HilliSrfLandedPR = These low areas are filled with the powdery, oxidised ejecta of countless impacts.  Walking here feels like walking freshly laid snow.  

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    @RESULTS
    {
        InSpace = The Goo seems... uninterested.  It's just sittin' there.  
    
        KnuraFlyingSky = The Goo jiggles merrily, reflecting the blue of the sky on its wobbly body.  
        KnuraFlyingClouds = The Goo settles down and contracts a little.  It looks like it's forming some condensation on its surface.  
        KnuraInSpace = The sample seems to gravitate towards the welcoming planet below.  

        HopInSpace = The sample seems to gravitate towards Knura, ignoring the little asteroids altogether.  
        HopSrfLanded = The Goo contracts into a tight ball, and little icy crystals start to form on its surface.  Does this hurt the Goo?  You hope not.  

        SkipInSpace = The sample seems to gravitate towards Knura, ignoring the little asteroids altogether.  
        SkipSrfLanded = The Goo contracts into a tight ball, and little icy crystals start to form on its surface.  Does this hurt the Goo?  You hope not.  

        GlothFlyingLowoSea_wet = The sample is repeatedly, albeit a little pathetically, thumping against the bottom of the container.  
        GlothFlying = The Goo spreads extends out two little blobs, like little flabby wings, waves them merrily.  
        GlothInSpaceLow = The sample has started ignoring Knura, and instead is pooling towards Gloth.  
        GlothInSpaceHigh = The sample is sitting sadly, occasionally turning its body mass towards Knura.  
        GlothSrfSplashedssSea_wet = The sample swishes joyously back and forth in its capsule.  
        GlothSrfSplashedoSea_wet = The sample is almost manic in agitation, swelling and vibrating with an energy you've never seen before.  You swear the ocean around you is vibrating in kind.  
        GlothSrfSplashed = The Goo seems excited to be here.  
        GlothSrfSplashedrCrateL_wet = The sample settles into a placid liquid state, while its surface seems to shimmer with subtle colour and shape.  
        GlothSrfSplashedCAT_wet = The Goo is... meowing?  A sort of wet, bubbly "bbbbrauh" sound. Ew.   
        GlothSrfLandedrCrate = The sample seems to pull towards the surrounding sea, lapping against its capsule walls.  
        GlothSrfLandedSPECIAL = Did the sample always have a little face?  
        GlothSrfLanded = The sample seems to expand as Knura is overhead, and compress and sink as it falls below the horizon.  Interestingly, it has no reaction to the position of the sun.  
        GlothSrfLandedBIGSHROOM = The Goo seems to be forming little, mushroom shaped towers.  

        ChopleSrfLandedCRAGGLE = The sample begins bubbling and popping.  
        ChopleSrfLandedvHigh = The Goo puffs up, turning into a slightly opaque white-green foam.  You silently hope you haven't killed it or something.  
        ChopleSrfLanded = The goo shimmers a deep, sea green.  

        BasilSrfLandedMAR = The goo morphs into a little ball, suspended on a single, wobbly leg.  
        BasilSrfLandedcrateBasin = The Goo relaxes, spreading out to fill its container.  You give the pod a good kick and notice that it's become quite runny.  
        BasilSrfLanded = The samples hue shifts into a deep, rich blue.  Why is this?  Why is it blue?  

        OllaganderInSpaceLow = The Goo seems agitated... 
        OllaganderSrfLanded = The Goo shifts in its container, forming smooth, arching structures and shapes that resemble tiny, spiky trees.  
        OllaganderSrfLandedwCrate = The sample becomes stiff, forming in a hard abstract shapes with big, reflective surfaces.  
        OllaganderSrfLandedkCrate = The sample becomes stiff, forming in a hard abstract shapes with big, reflective surfaces.  
        OllaganderSrfLandedcCrate = The sample becomes stiff, forming in a hard abstract shapes with big, reflective surfaces.  
        OllaganderSrfLandedhCrate = The sample becomes stiff, forming in a hard abstract shapes with big, reflective surfaces.  
        OllaganderSrfLandedbCrate = The sample becomes stiff, forming in a hard abstract shapes with big, reflective surfaces.  
        OllaganderSrfLandedmCrate = The sample becomes stiff, forming in a hard abstract shapes with big, reflective surfaces.  
        OllaganderSrfLandedhetCrate = The sample becomes stiff, forming in a hard abstract shapes with big, reflective surfaces.  

        LemaSrfLanded = The Goo has turned pink!  How fun!  
        LemaSrfLandedPEAKS = The Goo has formed small tendrils, and is reaching up towards the stars.  
        LemaSrfLandedFLOOR = The sample has formed into a potato-ish shape, and has turned a deep purple colour.  The unusual slight makes you grimace.  
        LemaSrfLandedNORTH = Wheres north from here?  

        RunInSpaceLow = The sample contracts a little whenever the ship sweeps past one of Runs sub-moons.  
        RunSrfLanded = The sample looks positively dizzy.  
        RunSrfLandedSPECIAL = To your absolutely shock and horror, the sample has managed to force itself out of its container, and it rapidly squelching across the moons surface away from the ship.  And to think the KSA said you wouldn't need to fishing net for anything!  
        
        SixleSrfLanded = The Goo takes on a darker hue, and doesn't do all that much else.  
        SixleSrfLandedCRATE = The Goo turns almost completely black, and sloshes around limply in its container.  You've never seen it so depressed.  

        HilliSrfLanded = The sample pools up into a tight, wrinkly ball.  It almost looks... veiny.  Ew... 

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    @RESULTS
    {
        KnuraFlyingLowCD = 
        KnuraFlyingLowCB = 
        KnuraFlyingLowCS = 
        KnuraFlyingHigh =   
        KnuraInSpace = One of your crew mates made one too many jokes about "cracking open a window to let the fresh air in", so you've opted to duct tape him to his chair.  They're not too happy about it, but then they also aren't in any position to complain.

        HopSrfLanded = By employing the time-tested experimental method of hopping out of the module and seeing how far you can walk without falling over, your crew has determined that Hops surface is indeed icy.  
        
        SkipSrfLanded = By employing the time-tested experimental method of hopping out of the module and seeing how far you can walk without falling over, your crew has determined that Skips surface is indeed icy.  

        GlothFlying = Flying through Gloths atmosphere is a slow and difficult process, and being stuck in a laboratory-cum-tincan is making it no more enjoyable. 
        GlothInSpaceLow = You're able to sample the very upper layers of Gloths atmosphere from this altitude.  Unsurprisingly, it's mostly Hydrogen.  
        GlothInSpace = Instead of doing any good science, the crew have decided to test who can hold the most freeze-dried apple sauce in their mouth without it coming out their nose.  The good news is you're winning!  
        GlothSrfSplashed = Sitting in this module, floating in this sea, you feel like you are one step closer to fulfilling your dream of being a grape suspended in a jelly.  
        GlothSrfLanded = The science team have been tracking oily mud into the module.  It smells... kinda cheesy, actually.  Huh...  
        GlothSrfLandedBIGSHROOM = You've been studying these giant mushrooms for so long, you swear that little mushrooms have started growing on your feet.  Wait, no... those are your toes.  
        
        ChopleSrfLanded = The crew are having a great deal of fun shining variously coloured light through samples of the surface, and seeing what colours come out the other side.  

        BasilSrfLandedMAR = The soil here is nutrient rich, and appears to off-gas when exposed to water and warmth.  How odd... 
        BasilSrfLanded = Every-damn-thing in this lab is covered in blue dust.  It's sticking to everything.  Good lord.  

        OllaganderSrfLanded = In-depth analysis has revealed that, as well as mud and ice, the soil on Ollagander is filled with tiny metallic shards.  Not only that, but it's scratched up all your nice Microscope slides. Damn it i got these for my birthday!  

        LemaInSpace = Using the modules nifty high-resolution radar-altimeter, you have determined that Lema is sorta round, but sorta bumpy.  You wonder if the space taken up by the instrument wouldn't have been better used by, like, an ice cube maker or something.  
        LemaSrfLandedMOUNT = From this high altitude, you are able to use the modules onboard cameras to take a panorama of the moons surface.  This'll make a hell of a kristmas card. 
        LemaSrfLanded = You find that the whitish-pink surface snow here turns to liquid under pressure.  How odd! 
        LemaSrfLandedFLOOR = Every time you collect a capsule of surface slush, one of your crew mates drinks it.  It doesn't seem to have killed 'em yet but you're sure it can't be good for them.  
        LemaSrfLandedNORTH = The snow here is full of tiny glassy splinters.  Maybe these are what nucleates the larger ice crystals here?  

        RunInSpace = The crew have started doing a Mexican wave whenever the module sweeps past Runs sub-moons.  
        RunSrfLandedSMUSH = You and your crew mates have started collecting mud samples and taking bets on whether they will be red or brown.  You've already collected nearly 56kg of mud.  
        RunSrfLanded = Detailed chemical analysis has confirmed that, despite appearances, Run is not a large peanut.  
        RunSrfLandedSPECIAL = Every instrument dial has dropped to zero, and the lights have gone out.  It's somewhat ominous.  But interesting! 

        SixleInSpace = You use the modules onboard cameras that measure the Sixles albedo.  You determine that it is... reasonably high.  
        SixleSrfLanded = The grounds too hard to take a sample from, or really drill into at all, so you and your crew mates decide to look through the onboard media centre.  You've found a show centred around some people with cute cartoon avatars, that have become trapped in a virtual circus.  You find yourself inexplicably attracted to the purple rabbit.  
        SixleSrfLandedCRATE = Every dial in the module is spinning, sci-fi B-movie style.  Nothing a little duct tape won't solve.  

        HilliInSpace = You use the modules onboard cameras to perform a spectral analysis on Hillis surface. Your findings suggest that it is brownish. 
        HilliSrfLanded = The grounds too hard to take a sample from, or really drill into at all, so you and your crew mates decide to look through the onboard media centre.  You've found an animated movie about a sentient coffee bean, that runs around shooting people and fighting crime.  It's... not very good.   

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    @RESULTS
    {
        KnuraFlyingLow = The rolling lower atmosphere drives gusts of warm, dry air.  
        KnuraFlyingHigh = Water begins condensing on the thermometer.  
        KnuraInSpaceLow = The warm-ish interior of the Ice Giant gives off a slight, infrared glow.  It's better than nothing!  
        KnuraInSpaceHigh = Despite the big blue planets inviting appearance, up here it's as cold as anywhere else in space.  

        HopInSpace = Small clumps of ice hit and stick to the thermometer.  
        HopSrfLanded = You note no difference in temperature between the surface and orbital space.  

        SkipInSpace = Between Knuras rings and the snowball down below, there is just altogether too much ICE here.  You're sick of ICE at this point.   We should do something about ICE. 
        SkipSrfLanded = The thermometer hasn't moved one bit.  

        GlothFlyingLowssSea_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowoSea_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowMR_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowMM_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowMS_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowLA_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowrCrateL_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowmiscL_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLowCAT_wet = The dark oceans and seas radiate a surprising amount of heat, keeping the air just above their surface nice and toasty.  
        GlothFlyingLow = Its not... not cold?  
        GlothFlyingLowBIGSHROOM = The dark Shrump caps radiate a tiny amount of heat as you fly over them.  
        GlothFlyingHigh = The blanket of Gloths atmosphere is thinner here, and you can feel it.  
        GlothInSpace = The warm glow of the yellow moon below you does little to offset the grasping cold of space.  
        GlothSrfSplashed = This must be what it feels like to drown in a tar field.  
        GlothSrfLanded = Between the insulating atmosphere and the tidal effects of its neighbouring moons, Gloths surface temperature is surprisingly high.  Well, high compared to the depths of space... 
        GlothSrfLandedBIGSHROOM = The topology and towering Shrumps seem to form a pocket of trapped warm air.  It's almost pleasant!  

        ChopleInSpace = The thermometer periodically hops as the ship passes through a reflected beam of light.  
        ChopleSrfLanded = A surface emits a barely-detectable hint of heat.  

        BasilInSpace = Its so cold out here, even the moons gone blue!  
        BasilSrfLandedMAR = Ambient temperatures here are higher than on the rest of the moon.  
        BasilSrfLanded = The surface is slightly warmer than expected.  Perhaps an indication of some latent geothermal activity?  

        OllaganderInSpace = You think to yourself that, even against the infinite harsh blackness of space, this small ball of clay appears cold, wet, grey and inhospitable.  You then remember than you are a thermometer, and cannot think, and so get back to measuring temperature.  
        OllaganderSrfLanded = Its cold, it's wet, and you wonder what exactly you expected.  
        OllaganderSrfLanded = The dense, wet soil drains the warmth out of everything it touches.  

        LemaInSpace = Tiny specs of icy purple sludge cling to the thermometer.  
        LemaSrfLanded = Frostalicious!  
        LemaSrfLandedNORTH = Fuzzy ice crystals start to form on the thermometer.  

        RunInSpace = Runs elliptical orbits causes it to swing through a temperature range of "cold" and "very cold".  
        RunSrfLanded = The looming shadows of the asteroids hemispheres keep most of Runs surface in an iced-over state. 

        SixleInSpace = Sharp reflections from the sun cause the thermometer to jump up and down like a bug on a barbecue.  
        SixleSrfLanded = The moons metallic surface absorbs heat at a frightening rate.  

        HilliInSpace = Hillis coppery glow makes you feel warm, and really thats all that matters at the end of the day.  
        HilliSrfLanded = The moons metallic surface absorbs heat at a frightening rate.  

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    @RESULTS
    {
        KnuraFlyingLow = The pressure dials hand is spinning in circles.  You're not sure exactly what that means but you're sure it isn't good.  
        KnuraFlyingHigh = The pressure here is... alright, all things considered. Not too high, not too low.   

        HopSrfLanded = Against all odds, the pressure gauge isn't quite at zero.  This asteroid must be able to hold on to a thin sheath of gas that managed to escape from Knura.  

        SkipSrfLanded = You detect nothing of note.  

        GlothFlyingLow = The air pressure here is so high that your terminal velocity is just a few metres a second.  
        GlothFlyingHigh = Unlike Kerbins atmosphere, Gloths atmosphere has virtually no gradient.  The pressure is still unbelievably high even at these altitudes. 
        GlothInSpaceLow = You're dial doesn't say zero.  Thats worrying.  
        GlothSrfLandedHIGH = You notice that the pressure dial is making a tiny, high-pitched whining sound.  
        GlothSrfLandedLOW = The pressure readout is flashing an angry face at you.  That can't be good... 
        GlothSrf = The atmospheric pressure here is roughly equivalent to what you'd feel scuba-diving 30 metres below sea level back on Kerbin.  You wonder if you could fly by strapping wheelie-bin lids to your arms and flapping them.  

        ChopleSrfLanded = Your sensors fail to detect any atmosphere worth writing home about.

        BasilSrfLandedMAR = You noticed that the dial tickets just barely above zero every so often.  You'd need to use some other sensors to get a better idea of whats causing this.  
        BasilSrfLanded = The readout indicates that the atmospheric pressure here is three hundred times greater than in the vacuum of space.  You sit confused for a moment before realising that three hundred multiplied by zero is still zero.  You wonder which of the programmers back at the KSA was the smartass that thought that would be funny.  

        OllaganderSrfLanded = Deciding that there isn't much point in taking barometric readings on a planet with no atmosphere, you instead browse the ships built-in media centre.  You find a folder filled with lurid graphic novels about various mythological creatures - you don't much care for "Help! My Teacher is the Kraken!", but you are intrigued by "My Life as a Teenaged Mystery-Goo Girl".  

        LemaSrfLanded = Instead of checking the barometric sensor on this clearly atmosphere-less ball of snow, you instead decided to watch some of the movies that the scientists downloaded onto the ships media centre.  You find yourself engrossed by a film about a kerbal running from the police while search for the one-armed Kerbal that killed his wife.  You think you sense some romantic tension between him and the main detective but you aren't sure.  

        RunSrfLanded = The dial refuses to move despite all your tapping.  

        SixleSrfLanded = Instead of looking at the pressure dial, you spent an hour trying to type out a message to the KSA with your toes.  You're remarkably good at it.  

        HilliSrfLanded = You get distracted from your experience by a movie you were watching in the background.  It is about two Kerbals working for a government agency, that investigate reports of aliens hiding among us, causing mischief and creating grotesque half-kerbal, half-"hew-man" babies.   

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    @RESULTS
    {
        KnuraLanded = The sensors readout starts playing an odd video - it appears to be a sequence of characters, rendered in silhouette with ASCII characters, performing a range of activities like dancing, flying on a broom stick, standing on a boat and playing musical instruments.  The sensor is also playing a single tune to go alone with the video by repeatedly playing it error "bing" sound at different pitches.  It's all very hypnotic.  
        KnuraInSpace = You pick up dozens of little bounces and shifts in the gravitational field as Knuras moons move by.  

        HopInSpace = Your instruments struggle to take a good reading amidst the gravitational noise of the system.  You wonder how you even managed to get into this things orbit.  
        HopSrfLanded = Hops surface gravity is so weak that it shifts noticeably while Knura is overhead.  

        SkipInSpace = You detect minute variations as you orbit this tiny moon.  
        SkipSrfLanded = You've definitely seen bigger numbers than this before.  

        GlothInSpace = Your readings shift back and forth and you pass over seas and craters.  The movement of the dial is quite hypnotic.  
        GlothSrf = Gloths weak gravity makes you wonder how it could possibly hold on to such a thick atmosphere.  

        ChopleInSpace = Your sensors pick up sharp increases in the gravitational field as you pass over Choples mountain ridges.  
        ChopleSrfLanded = The strength of its surface gravity suggests that Chople has an almost perfectly uniform internal structure.  

        BasilInSpace = You detect a sharp increase is gravitational pull when over the Mare Lamenta.  What is it so sad about, anyway?  
        BasilSrfLandedMAR = Surface gravity here is marginally higher than the rest of the moon.  You feel maybe... 1.3% more sluggish.  
        BasilSrfLanded = Your detailed scientific measurements reveal that, even in this far-flung corner of the universe, gravity till points down. 

        OllaganderInSpace = You pick up small increases in gravity when you pass over some of the larger craters.  
        OllaganderSrfLanded = The surface gravity here is more than enough, and nothing to be ashamed of. 
        OllaganderSrfLandedE = Gravity here is a little bit higher than it is nearer the poles.  

        LemaInSpace = You detect small increases in gravity over the ancient crater basins, and drops when you move over mountains.  
        LemaSrfLanded = Surface gravity is amazingly unamazing.  

        RunInSpaceLow = The local gravity lurches uncomfortably as you swing past either sub-satellite.  You've been on rollercoasters more relaxing than this.  
        RunInSpaceHigh = From here, the gravitational field seals to point roughly straight down.  
        RunSrfLandedSMUSH = Your instruments struggle to pick a direction to point in.  
        RunSrfLanded = The local gravity is pointing... mostly straight down, with a noticeable kick off towards the other hemisphere.  

        SixleInSpace = The sensor picks up a disappointingly regular gravitational field.  And to think, you came out all this way... 
        SixleSrfLanded = Sixle's high density gives it a high surface gravity, keeping your feet reassuringly stuck to the ground.  
        SixleSrfLandedCRATE = You pick up a minute deviation in the local gravitational field, coming from the centre of this crater... 

        HilliInSpace = You detect distinct high and low points in Hilli's gravitational field.  You deduce that the small body is, indeed, lumpy.  
        HilliSrfLanded = The surface gravity here is slightly lower than you'd expect from a giant metal ball.  Perhaps it's not solid all the way through?  

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]
{
    @RESULTS
    {
        KnuraFlyingLow = Its not exactly an imperial measurement, but the air below you does seem to be... growling a little.  

        HopSrfLanded = You detect a signal that sounds a little like fresh snow being stepped on, or a snowball being crushed.  It's very wintery.  

        SkipSrfLanded = Is it just me or is the ground here buzzing?  

        GlothSrfSplashed = The gelatinous soup that make up Gloths oceans act as an effective vibration dampener - all you pick up are the slow ebbing and flowing of the world's complex tides.  
        GlothSrfSplashedCAT_wet = The sea here seems to be... purring?  It's odd, but not entirely unpleasant.  
        GlothSrfLanded = Gloth does not appear to be geologically active, but you do pick up a quiet, seismic occasional, icy crackling from below the surface.  
        GlothSrfLandedBIGSHROOM = The ground here seems to hum in a constant, rhythmic fashion, rising and falling with the motion of the sun.  

        ChopleSrfLandedCRAGGLE = Your sensors - and your feet - pick up an occasional, violent pop coming from just below the surface.  Some of these quakes are strong enough to kick up dust and send small rocks flying.    
        ChopleSrfLanded = You pick up the occasional internal vibration, but you notice that they echo strangely.  It seems as if the interior of the moon is filled with countless cracks and discontinuities, some hundreds of miles across.  

        BasilSrfLanded = You detect a number of small, faint quakes.  It seems that Basil is not entirely geologically dead.  
        BasilSrfLandedMAR = Readings here suggest a matrix of ancient lava tunnels lies just below the surface.  

        OllaganderSrfLanded = The way that seismic waves propagate through the moon hints at the presents of a sub-surface ocean.   

        LemaSrfLandedMOUNT = This entire mountain is a puffy pile of snow -  all you detect is the sound of the lander slowly sinking into the ground.  
        LemaSrfLanded = You detect evidence of pockets of grape-flavour purple liquid below the surface, surrounding a very dense core.  

        RunSrfLanded = The sensors pick up nothing but the occasional pitter-patter of ring material hitting the surface.  
 
        SixleSrfLanded = The entire asteroid seems to vibrating at a dead-constant frequency, like a giant bell.  

        HilliSrfLanded = You detect... absolutely nothing.  No vibration whatsoever.  

    }
}

@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]
{
    @RESULTS
    {
        KnuraFlyingLow = The high pressure down here is making it hard to take any good readings.  There is a far higher concentration of oxygen and volatiles, as well as traces of sulphuric compounds.  
        KnuraFlyingHigh = The atmosphere up here is cool, crisp and remarkably Kerbin-like - a mixture of oxygen, nitrogen and H2O, with traces of CO2 and fruity volatiles.  Smells kinda like Pears.  
        KnuraInSpaceLow = The instruments are still picking up the occasional molecule, but they are increasingly few and far between.  You aren't totally sure what you expected to find here.  
        KnuraInSpaceHigh = It definitely seems like you aren't in the atmosphere anymore.  

        Hop = There's no atmosphere here, Einstein!

        Skip = There's no atmosphere here, genius!  

        GlothFlyingLow = The air here is a dense mixture of hydrocarbons and smelly smells.  
        GlothFlyingHigh = The air up here might be a little more breathable than down on the surface.  
        GlothInSpaceLow = The instruments have found that the atmosphere of Gloths day side puffs up by a few kilometres.  It maybe wouldn't be a good idea to stay in this orbit for too long... 
        GlothInSpaceHigh = Not all that much to detect up here apart from the occasional enterprising speck of high-velocity dust.   
        GlothSrf = Your instruments seem quite unhappy about having to analyse an atmosphere this dense and complex.  It's like an oily, smelly soup.  
        GlothSrfLandedHIGH = The atmosphere is a little clearer of long-chain molecules here.  You're able to detect methane, and various alcohol compounds.  
        GlothSrfLandedBIGSHROOM = Your instruments become clogged with pollen.  While you do feel bad for your poor little doodad, You're very glad that it's not you that suffering from alien hay-fever.   

        Chople = There's no atmosphere here, dingus!

        Basil = There's no atmosphere here, you great big braincell on legs!
        BasilSrfLandedMAR = You pick up tiny over-abundances of methane that seem to coincide with when Knura is overhead.  Something in this region must be producing it... 

        Ollagander = There's no atmosphere here, dough-ball!  

        Lema = There's no atmosphere here, you lemon! 
        LemaSrfLandedNORTH = Against all odds, you detect a faint, humid atmosphere here!  

        Run = There's no atmosphere here, you idiot!  

        Sixle = There's no atmosphere here, you intellectual specimen!  

        Hilli = There's no atmosphere here, you bottom-feeder!  

    }
}

