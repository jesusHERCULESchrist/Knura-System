        RunSrfLandedSMUSH = The ground is a mixture of big and small boulders from both Dart and Dash, all mixed up with a frozen clay.  With the two moonlets looming over your, you feel a little claustraphobic.  
        RunSrfLandedDASH = This half of Run is made up of a powdery, dark grey rock, like a pumice stone thats been smushed full of clay.  You're quite sure that your suit would rip if your snagged it on anything, so you start watching your step.   
        RunSrfLandedDART = This moonlet is far less rocky than its counterpart.  Instead, its mostly made up of reddish mud, speckled with the occational chunk of rock and ice.  You wonder if it used to be part of a bigger, wetter moon.   
        RunSrfLandedCLIFF = Once upon a time, this would have just been an unremarkable plot of land on Dash.  But since the collision its become a terrifying cliff, rising at an almost perfect right-angle from Runs centre of gravity.  How on Kerbin did you manage to land here?  
        RunSrtLandedSPECIAL = A shiver runs up your spine, like a cold wind cut you your through your spacesuit and down to your very core.  You don't know why, but this particular spot makes you feel... alone.  Uneasy.  Like time itself has left you, and you've become lost in a dark place.  Lost in... 1970s east coast Scotland.  My god... 
        RunInSpaceLow = Runs oblong shape means that even a nice, circular orbit brings your perilously close to the surface.  Seeing its lobes swing towards your at hundreds of metres per second is always a stomach-churning experience.  
        RunInSpaceHigh = From up here you can clearly see what makes this remote asteroid so special - its made up of two clearly deliniated bodies - nicknamed Dart and Dash - that at some point crashed together so gently that they retained their orignal shapes, leaving behind the impressively peanut-shaped Run.  

        SixleInSpaceLow = Sixles surface is a swirled mix of brilliant bright ridges, and dusty black ravines.  It looks like an old, fancy silver cup.  
        SixleInSpaceLowCRATE = You spot an unusual feature on Sixles otherwise jewel-like surface - a vast crater, stained a greyish black.  What could have blown such a hole out of this big metal ball?  
        SixleInSpaceHigh = As Hilli and Sixle turn below you, random flashes of reflected sunlight jump from their surface and try their best to blind you. 
        SixleSrfLandedPR = These low areas are filled with the powerdery, oxidated ejecta of countless impacts.  Walking here feels like walking freshly laid snow.  
        SixleSrfLandedSR = When you look down, you see a wobbly reflection of the stars above you.  And of course your own handsome mug.  
        SixleSrfLandedCRATE = You look around - steep, blackened crater walls rise above you in all directions, melted out from the steely ground by some terrible event.  

        HilliInSpaceLow = Even this near the surface, Hilli still looks small.  Its a small, lumpy, slightly squat ball of brassy metal.  
        HilliInSpaceHigh =  As Hilli and Sixle turn below you, random flashes of reflected sunlight jump from their surface and try their best to blind you.  
        HilliSrfLandedBH = The ground here is hard, shiny, and distressingly slipperly.  
        HilliSrfLandedPR = These low areas are filled with the powerdery, oxidated ejecta of countless impacts.  Walking here feels like walking freshly laid snow.  

    }
}

